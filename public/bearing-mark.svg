<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="Bearing mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Bearing</title>
  <!-- the plan: a hopeful, dashed line -->
  <path d="M8 50 C 16 22, 34 12, 56 12" stroke="#0E1426" stroke-opacity="0.32" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
  <!-- what actually happened: a solid line -->
  <path d="M8 50 C 20 47, 30 43, 38 33" stroke="#0E1426" stroke-width="5" stroke-linecap="round"/>
  <!-- the corrected next plan, born from reality -->
  <path d="M38 33 C 44 26, 50 24, 57 25" stroke="#F26B3A" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 9"/>
  <!-- now -->
  <circle cx="38" cy="33" r="6" fill="#F26B3A"/>
</svg>
